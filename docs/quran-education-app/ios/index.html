<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting to Quran Kit</title>
    <link rel="canonical" href="../../quran-kit-app/ios/" />
    <meta http-equiv="refresh" content="0; url=../../quran-kit-app/ios/" />
    <meta name="robots" content="noindex" />
</head>
<body>
    <p>This page has moved to <a id="dest" href="../../quran-kit-app/ios/">the Quran Kit iOS page</a>.</p>
    <script>
        const dest = document.getElementById('dest');
        const url = new URL(dest.href);
        url.search = location.search;
        url.hash = location.hash;
        location.replace(url.toString());
    </script>
</body>
</html>
